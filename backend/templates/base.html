<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Minab{% endblock %}</title>
    
    <!-- Google Fonts: Inter / Google Sans Fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Google Sans"', '"Product Sans"', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#131b2e',
                        cardBorder: '#1e293b',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: "Google Sans", "Product Sans", "Inter", system-ui, -apple-system, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
        }
        .flat-panel {
            background-color: #131b2e;
            border: 1px solid #1e293b;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-darkBg text-slate-100 flex flex-col antialiased">
    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded bg-slate-800 p-1 border border-slate-700 flex items-center justify-center">
                    <img src="/static/logo.png" alt="Minab Logo" class="w-full h-full object-contain">
                </div>
                <div>
                    <span class="text-base font-bold text-white tracking-tight">
                        ምናብ | Minab
                    </span>
                    <span class="text-[10px] text-blue-400 block -mt-1 font-mono uppercase tracking-wider">
                        3D Reconstruction Engine
                    </span>
                </div>
            </a>

            <nav class="flex items-center gap-4">
                <a href="/" class="text-xs font-semibold text-slate-300 hover:text-white transition-colors">
                    3D Studio
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
